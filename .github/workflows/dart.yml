# CI for Open Scripture Voice (a Flutter project).
#
# Uses subosito/flutter-action to set up the Flutter SDK, then runs the
# standard quality gate: resolve dependencies, analyze, and test.
# Note: this is a Flutter app — `dart test` / `dart pub get` alone cannot
# resolve the `flutter` SDK packages, so all steps use the Flutter tool.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'  # latest stable 3.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
